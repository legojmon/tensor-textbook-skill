<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TENSOR 회로이론 표지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:300;font-display:block;src:url(assets/fonts/Pretendard-Light.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:400;font-display:block;src:url(assets/fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:block;src:url(assets/fonts/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:block;src:url(assets/fonts/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:900;font-display:block;src:url(assets/fonts/Pretendard-Black.woff2) format('woff2')}
body{margin:0}
a{color:#666}a:hover{color:#333}
</style>
</helmet>
<div style="width: 794px; height: 1123px; position: relative; overflow: hidden; background: #ffffff; font-family: 'Pretendard', sans-serif; color: #33333b">

<svg width="794" height="1123" viewBox="0 0 794 1123" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs>
<linearGradient id="fieldA" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="420" y2="860">
<stop offset="0" stop-color="#ECE6FE"></stop>
<stop offset="0.45" stop-color="#C9B8F7"></stop>
<stop offset="1" stop-color="#9C80EC"></stop>
</linearGradient>
<linearGradient id="fieldB" gradientUnits="userSpaceOnUse" x1="460" y1="140" x2="760" y2="1000">
<stop offset="0" stop-color="#D9CDFB"></stop>
<stop offset="0.4" stop-color="#A88EF2"></stop>
<stop offset="0.75" stop-color="#7A55DE"></stop>
<stop offset="1" stop-color="#5A6BDD"></stop>
</linearGradient>
</defs>

<!-- 오른쪽: 커패시터 기호 — 리드선 + 두 극판 -->
<rect x="500" y="-10" width="72" height="440" fill="url(#fieldB)"></rect>
<rect x="372" y="430" width="460" height="76" fill="url(#fieldB)"></rect>
<rect x="372" y="584" width="460" height="76" fill="url(#fieldB)"></rect>
<rect x="500" y="660" width="72" height="480" fill="url(#fieldB)"></rect>

<!-- 왼쪽: 오메가(Ω) -->
<circle cx="110" cy="560" r="220" fill="url(#fieldA)"></circle>
<circle cx="110" cy="585" r="88" fill="#ffffff"></circle>
<rect x="84" y="640" width="52" height="200" fill="#ffffff"></rect>
<rect x="-20" y="752" width="104" height="58" fill="url(#fieldA)"></rect>
<rect x="136" y="752" width="196" height="58" fill="url(#fieldA)"></rect>
</svg>

<!-- 좌상단 문구 -->
<div style="position: absolute; left: 48px; top: 56px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; font-weight: 400; letter-spacing: 0.42em; color: #44444c">
<span>기본부터</span>
<span>심화까지</span>
<span>완성하는</span>
</div>

<!-- 우상단: 과목명 -->
<div style="position: absolute; right: 48px; top: 52px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
<span style="font-size: 30px; font-weight: 900; letter-spacing: 0.3em; margin-right: -0.3em; color: {{ink}}">회로이론</span>
<span style="font-size: 13px; font-weight: 400; letter-spacing: 0.3em; margin-right: -0.3em; color: #44444c">시험 개념의 완성</span>
</div>

<!-- 세로 타이틀: TENSOR -->
<div style="position: absolute; left: 26px; top: 257px; display: flex; flex-direction: column; font-size: 108px; font-weight: 900; line-height: 0.98; color: {{ink}}">
<span style="margin-left: 0px">T</span>
<span style="margin-left: 46px">E</span>
<span style="margin-left: 6px">N</span>
<span style="margin-left: 52px">S</span>
<span style="margin-left: 10px">O</span>
<span style="margin-left: 48px">R</span>
</div>

<!-- 하단 좌: 서울대학교 로고 -->
<div style="position: absolute; left: 48px; bottom: 44px; display: flex; align-items: center; gap: 12px">
<img src="assets/logo/snu-logo.png" alt="Seoul National University logo" style="height: 52px; width: auto; display: block">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.3; color: #33333b">Seoul National<br>University</span>
</div>

<!-- 하단 우: 저자 -->
<div style="position: absolute; right: 48px; bottom: 56px; display: flex; align-items: baseline; gap: 10px; font-size: 13px; color: #44444c">
<span style="font-weight: 500; letter-spacing: 0.18em">김준형 · 최재원</span>
<span style="font-weight: 300; color: #6a6a72">지음</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B3FD4"},"ink":{"editor":"color","default":"#3A3A42"},"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6B3FD4', ink: this.props.ink ?? '#3A3A42' };
}
}
</script>
</body>
</html>
