<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TENSOR 회로이론 책등</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Pretendard';font-weight:300;font-display:block;src:url(assets/fonts/Pretendard-Light.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:400;font-display:block;src:url(assets/fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:block;src:url(assets/fonts/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:block;src:url(assets/fonts/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:900;font-display:block;src:url(assets/fonts/Pretendard-Black.woff2) format('woff2')}
body{margin:0}
a{color:#fff}a:hover{color:#eee}
</style>
</helmet>
<div style="width: 57px; height: 1123px; box-sizing: border-box; padding: 44px 0 36px; background: linear-gradient(180deg, {{accent}} 0%, #5A4BD8 100%); font-family: 'Pretendard', sans-serif; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: space-between">

<div style="writing-mode: vertical-rl; display: flex; align-items: center; gap: 26px">
<span style="font-size: 22px; font-weight: 900; letter-spacing: 0.32em">TENSOR</span>
<span style="width: 1.5px; height: 28px; background: rgba(255,255,255,0.6)"></span>
<span style="font-size: 24px; font-weight: 900; letter-spacing: 0.12em">회로이론</span>
<span style="font-size: 13px; font-weight: 400; letter-spacing: 0.18em; color: #EDE7FF">시험 개념의 완성</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="writing-mode: vertical-rl; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; color: #EDE7FF">김준형 · 최재원</span>
<img src="assets/logo/snu-logo.png" alt="Seoul National University logo" style="height: 38px; width: auto; display: block; filter: brightness(0) invert(1)">
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B3FD4"},"$preview":{"width":57,"height":1123}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6B3FD4' };
}
}
</script>
</body>
</html>
